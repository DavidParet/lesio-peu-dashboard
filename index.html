/* ══════════════════════════════════════════════
   INSIGHTS IA CLÍNICS
══════════════════════════════════════════════ */
function computeInsights(kRow, trendDelta, avg7) {
  const items = [];

  // 1. Tendència general
  if (trendDelta !== null) {
    if (trendDelta > 0.25)
      items.push({ icon:'📈', title:'Millora funcional sostinguda', msg:`Score mig 7 dies: ${avg7?.toFixed(2)}. La recuperació avança de forma consistent (+${trendDelta.toFixed(2)} respecte la setmana anterior).`, badge:'Millora', badgeCls:'b-good' });
    else if (trendDelta < -0.25)
      items.push({ icon:'⚠', title:'Tendència d\'alerta detectada', msg:`El score ha pujat ${Math.abs(trendDelta).toFixed(2)} punts els últims 7 dies. Revisar la càrrega d'activitat i la qualitat del repòs.`, badge:'Atenció', badgeCls:'b-warn' });
    else
      items.push({ icon:'→', title:'Estabilitat clínica', msg:`Score mig 7 dies: ${avg7?.toFixed(2)}. La recuperació avança gradualment sense regressions significatives.`, badge:'Estable', badgeCls:'b-info' });
  }

  // 2. Correlació passos/dolor
  const highDays = ALL.filter(r => r.passos > 3500 && r.score !== null);
  const lowDays = ALL.filter(r => r.passos !== null && r.passos < 2500 && r.score !== null);
  if (highDays.length >= 3 && lowDays.length >= 3) {
    const diff = avg(highDays.map(r=>r.score)) - avg(lowDays.map(r=>r.score));
    if (diff > 0.3)
      items.push({ icon:'👟', title:'Dies d\'alta càrrega associats a major dolor', msg:`Dies amb >3.500 passos mostren un score ${diff.toFixed(2)} punts superior als dies de baixa activitat. Retard de resposta de 24–48h.`, badge:'Correlació', badgeCls:'b-alert' });
    else if (diff < -0.1)
      items.push({ icon:'👟', title:'Bona tolerància a la càrrega funcional', msg:`No s'observa augment de dolor els dies d'alta activitat. Indicador positiu de progressió funcional.`, badge:'Positiu', badgeCls:'b-good' });
  }

  // 3. Constància fisio
  const fisioCount7 = ALL.slice(-7).filter(r=>isSi(r.fisio)).length;
  if (fisioCount7 >= 3)
    items.push({ icon:'💆', title:'Fisioteràpia consistent aquesta setmana', msg:`${fisioCount7} sessions en els últims 7 dies. La constància terapèutica coincideix amb els períodes d'estabilització clínica observats.`, badge:'Consistent', badgeCls:'b-good' });
  else if (fisioCount7 === 0 && ALL.length > 7)
    items.push({ icon:'💆', title:'Setmana sense fisioteràpia', msg:`Cap sessió registrada en els últims 7 dies. Valorar reprendre la pauta terapèutica establerta.`, badge:'Pendent', badgeCls:'b-warn' });

  // 4. Son
  const avgSon7 = avg(ALL.slice(-7).map(r=>r.son).filter(v=>v!==null));
  if (avgSon7 !== null && avgSon7 < 6.5)
    items.push({ icon:'😴', title:'Son insuficient els últims 7 dies', msg:`Mitja de ${fmtH(avgSon7)} de son. El repòs inadequat afecta la recuperació tissular i incrementa la sensibilitat al dolor.`, badge:'Descans', badgeCls:'b-warn' });

  // 5. Inflamació activa
  if (kRow.inflam !== null && kRow.inflam >= 3)
    items.push({ icon:'🔥', title:'Inflamació activa detectable', msg:`Nivell ${kRow.inflam}/6 avui. Considerar reducció de la càrrega mecànica i aplicació de magnetoteràpia o crioterapia.`, badge:'Actiu', badgeCls:'b-alert' });

  // 6. Plateau
  const maFull = movAvg(ALL.map(r=>r.score), 7);
  const ma14 = maFull.slice(-14).filter(v=>v!==null);
  if (ma14.length>=10 && Math.abs(ma14[0]-ma14[ma14.length-1])<0.15)
    items.push({ icon:'⟳', title:'Fase de plateau de recuperació', msg:`La mitja mòbil 7 dies s'ha mantingut estable (±0.15) durant les últimes dues setmanes. Fase habitual en processos de recuperació tendinosa complexa.`, badge:'Plateau', badgeCls:'b-info' });

  // 7. Sobrecàrrega avui
  if (kRow.passos !== null) {
    const prev7avg = avg(ALL.slice(-8,-1).map(r=>r.passos));
    if (prev7avg && kRow.passos > prev7avg * 1.45)
      items.push({ icon:'⚡', title:'Càrrega superior a la mitja recent', msg:`Avui ${kRow.passos.toLocaleString('ca-ES')} passos (${Math.round((kRow.passos/prev7avg-1)*100)}% per sobre de la mitja setmanal de ${Math.round(prev7avg).toLocaleString('ca-ES')}). Monitoritzar la resposta en les properes 24–48h.`, badge:'Precaució', badgeCls:'b-warn' });
  }

  return items.slice(0, 5);
}

/* ══════════════════════════════════════════════
   MAIN RENDER
══════════════════════════════════════════════ */
function computeFase(kRow, trend14, nRelapses, totalDies) {
  const sc  = kRow?.score ?? null;
  const dia = kRow?.dia   ?? totalDies;
  if (sc === null) return { label: 'Consolidació', color: 'amber' };
  if (sc < 1.2 && trend14 >= -0.1 && dia > 60)
    return { label: 'Manteniment', color: 'green' };
  if (sc < 2.0 && dia > 45 && nRelapses < 3)
    return { label: 'Recuperació funcional', color: 'blue' };
  if (sc < 2.8 && dia > 20)
    return { label: 'Consolidació', color: 'amber' };
  if (sc < 3.5 || (dia > 14 && sc < 3.8))
    return { label: 'Subaguda', color: 'orange' };
  return { label: 'Aguda', color: 'red' };
}

function buildAnalisiClinica() {
  if (ALL.length < 3) return '';
  const last7  = ALL.slice(-7).filter(r => r.score !== null);
  const last30 = ALL.slice(-30).filter(r => r.score !== null);
  const all    = ALL.filter(r => r.score !== null);
  const avgArr = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const minV   = arr => arr.length ? Math.min(...arr) : null;
  const maxV   = arr => arr.length ? Math.max(...arr) : null;
  const avg7cl   = avgArr(last7.map(r=>r.score));
  const avg30cl  = avgArr(last30.map(r=>r.score));
  const last14 = ALL.slice(-14).filter(r=>r.score!==null);
  const firstH = last14.slice(0, Math.floor(last14.length/2));
  const secH   = last14.slice(Math.floor(last14.length/2));
  const trend14 = (firstH.length && secH.length) ? avgArr(firstH.map(r=>r.score)) - avgArr(secH.map(r=>r.score)) : 0;
  const relapses = all.filter((r,i) => i>0 && r.score>=3.5 && all[i-1].score<2.8);
  const passos7  = last7.filter(r=>r.passos).map(r=>r.passos);
  const avgPas7  = avgArr(passos7);
  const inflam7  = last7.filter(r=>r.inflam!==null).map(r=>r.inflam);
  const avgInflam7 = avgArr(inflam7);
  const coix7  = last7.filter(r=>r.coixesa!==null).map(r=>r.coixesa);
  const avgCoix7 = avgArr(coix7);
  const fase = computeFase(ALL[ALL.length-1], trend14, relapses.length, all.length);
  let parts = [];
  const totalDies = ALL[ALL.length-1]?.dia || all.length;
  parts.push(`Porta ${totalDies} dies de seguiment registrat. `);
  if (avg7cl !== null) {
    const min7 = minV(last7.map(r=>r.score));
    const max7 = maxV(last7.map(r=>r.score));
    const nivell = avg7cl < 1.5 ? 'nivells baixos, ben tolerats' :
                   avg7cl < 2.5 ? 'nivells moderats-baixos' :
                   avg7cl < 3.5 ? 'nivells moderats, que requereixen atenció' :
                                   'nivells alts, que indiquen activitat inflamatòria important';
    parts.push(`Durant els darrers 7 dies, el dolor s’ha mantingut en ${nivell} (mitjana ${avg7cl.toFixed(1)}/5, rang ${min7.toFixed(1)}–${max7.toFixed(1)}). `);
  }
  if (Math.abs(trend14) > 0.15) {
    if (trend14 > 0.3)
      parts.push(`La tendència de les darreres dues setmanes és clarament favorable: el dolor ha disminuït de forma progressiva. `);
    else if (trend14 > 0.1)
      parts.push(`S’observa una lleugera millora en la tendència global dels darrers 14 dies. `);
    else if (trend14 < -0.3)
      parts.push(`La tendència recent indica un empitjorament notable. Caldria revisar la càrrega d’activitat i els factors desencadenants. `);
    else
      parts.push(`La tendència recent mostra una lleugera regressió que mereix seguiment proper. `);
  } else {
    parts.push(`La tendència global dels darrers 14 dies mostra una estabilitat relativa. `);
  }
  if (avgPas7 !== null) {
    const tolOk = avgPas7 >= 3000 && avg7cl < 2.5;
    const tolRisc = avgPas7 >= 4000 && avg7cl >= 2.5;
    if (tolOk)
      parts.push(`La tolerància als passos és positiva: una activitat mitjana de ${Math.round(avgPas7).toLocaleString('ca-ES')} passos diaris no s’associa a augments significatius de dolor. `);
    else if (tolRisc)
      parts.push(`Amb una activitat mitjana de ${Math.round(avgPas7).toLocaleString('ca-ES')} passos diaris i un dolor de ${avg7cl.toFixed(1)}/5, és possible que hi hagi sobrecàrrega funcional. Es recomana moderar l’activitat temporalment. `);
    else if (avgPas7 < 1500)
      parts.push(`L’activitat d’aquests dies ha estat reduïda (${Math.round(avgPas7).toLocaleString('ca-ES')} passos de mitjana), compatible amb la fase actual de recuperació. `);
    else
      parts.push(`L’activitat diària s’ha mantingut en ${Math.round(avgPas7).toLocaleString('ca-ES')} passos de mitjana. `);
  }
  if (avgInflam7 !== null) {
    if (avgInflam7 < 1)
      parts.push(`L’inflamació és mínima o inexistent, la qual cosa és un signe positiu de resposta tissular. `);
    else if (avgInflam7 < 2)
      parts.push(`Es manté una lleugera inflamació residual (${avgInflam7.toFixed(1)}/5), habitual en aquesta fase del procés. `);
    else if (avgInflam7 < 3)
      parts.push(`L’inflamació present (${avgInflam7.toFixed(1)}/5) indica activitat inflamatòria activa. La crioterapía i el repòs relatiu segueixen sent rellevants. `);
    else
      parts.push(`L’inflamació és significativa (${avgInflam7.toFixed(1)}/5). Es recomana consultar amb el professional de referència per ajustar el tractament. `);
  }
  if (avgCoix7 !== null && avgCoix7 > 0.5) {
    if (avgCoix7 < 1.5)
      parts.push(`La marxa mostra una coixesa lleu (${avgCoix7.toFixed(1)}/5), que tendèix a millorar amb la progressió de la fisioteràpia. `);
    else if (avgCoix7 < 2.5)
      parts.push(`La coixesa moderada (${avgCoix7.toFixed(1)}/5) continua present, i és un indicador que la càrrega sobre la zona lesionada encara és limitant. `);
    else
      parts.push(`La coixesa marcada (${avgCoix7.toFixed(1)}/5) condiciona significativament la marxa. Caldrà valorar el suport ortopèdic o la descàrrega. `);
  }
  if (relapses.length > 0) {
    if (relapses.length === 1)
      parts.push(`S’ha registrat 1 episodi de reagudització durant el seguiment. `);
    else
      parts.push(`S’han registrat ${relapses.length} episodis de reagudització. Aquestes recaigudes suggereixen que la zona encara és sensible a la sobrecàrrega o a factors externs. `);
  }
  if (avg30cl !== null && avg7cl !== null && last30.length >= 14) {
    const diff = avg30cl - avg7cl;
    if (diff > 0.3)
      parts.push(`Comparant els darrers 7 dies amb la mitjana del mes (${avg30cl.toFixed(1)}/5), s’evidencia una millora real i sostinguda de ${diff.toFixed(1)} punts. `);
    else if (diff < -0.2)
      parts.push(`La mitjana dels darrers 7 dies (${avg7cl.toFixed(1)}/5) és lleugerament pitjor que la del mes (${avg30cl.toFixed(1)}/5). Cal valorar si hi ha hagut un canvi d’activitat o un factor desencadenador. `);
  }
  const faseDescs = {
    'Aguda': ['Prioritat absoluta: repòs, control del dolor i de la inflamació. Evitar activitat que incrementi els símptomes.', 'red'],
    'Subaguda': ['Inici progressiu de la mobilitat i del tractament actiu. La fisioteràpia té un paper central en aquesta fase.', 'orange'],
    'Consolidació': ['Fase de treball: tolerància creixent a la càrrega, enfortiment progressiu i consolidació dels guanys funcionals.', 'amber'],
    'Recuperació funcional': ["La funció es recupera de forma activa. Mantenir la constància terapèutica i no forçar el ritme.", 'blue'],
    'Manteniment': ["Fase de manteniment i prevenció. L’objectiu és evitar recaigudes i consolidar els guanys a llarg termini.", 'green'],
  };
  const faseDesc = faseDescs[fase.label] || ['Seguiment actiu.', 'neut'];
  parts.push(`<strong>Fase actual estimada: ${fase.label}.</strong> ${faseDesc[0]}`);
  const disclaimer = `<div style="margin-top:12px;font-size:10px;color:var(--text-3);line-height:1.6;border-top:1px solid var(--border);padding-top:10px">⚠ Aquesta anàlisi és orientativa i es basa en els valors registrats. No substitueix el criteri clínic del fisioterapeuta o metge responsable.</div>`;
  return `
    <div class="sec-lbl">Anàlisi clínica</div>
    <div class="card card-accent" style="margin-bottom:10px">
      <div class="card-title" style="color:var(--amber)">Anàlisi Clínica IA</div>
      <div class="card-sub">Interpretació automàtica de l’evolució · Últims 7 i 30 dies</div>
      <div style="font-size:12.5px;line-height:1.85;color:var(--text-2)">${parts.join('')}</div>
      ${disclaimer}
    </div>`;
}

async function render(rows) {
  setLoadStep('Processant dades...');
  ALL = parseRows(rows);
  ALL_EVENTS = detectVisits(ALL);
  const today = todayISO();
  const kRowRaw = ALL.find(r => r.iso===today) || ALL[ALL.length-1];

  // Dades parcials: si avui no té score però té dolor o passos → calcular provisional
  const isToday = kRowRaw.iso === today;
  const hasPartialData = kRowRaw.score === null &&
    (kRowRaw.dolorM !== null || kRowRaw.dolorV !== null || kRowRaw.passos !== null);
  const isProvisional = isToday && hasPartialData;

  let kRow = kRowRaw;
  if (isProvisional) {
    const pains = [kRowRaw.dolorM, kRowRaw.dolorV].filter(v => v !== null);
    const provisionalScore = pains.length > 0
      ? +(pains.reduce((a,b)=>a+b,0)/pains.length).toFixed(2)
      : null;
    kRow = { ...kRowRaw, score: provisionalScore };
  }

  const last = ALL[ALL.length-1];
  const avg7  = avg(ALL.slice(-7).map(r=>r.score));
  const avgP7 = avg(ALL.slice(-14,-7).map(r=>r.score));
  const trendDelta = (avg7!==null && avgP7!==null) ? (avgP7-avg7) : null;
  const risk = computeRisk(kRow, trendDelta);
  const recScore = computeRecoveryScore(kRow, trendDelta);
  const monState = getMonitoringState(kRow, today);

  setLoadStep('Generant resum clínic IA...');
  let aiMsg = null, aiCtx = null, aiPred = [], aiCentral = null;
  try {
    const prompt = `Ets un assistent clínic de seguiment d'una recuperació de peu (fascitis plantar + peroneu curt + Aquil·les). Respon en català, to clínic tranquil, humà i intel·ligent. No absolut, no promeses.
AVUI — dia ${kRow.dia}: Score=${kRow.score} (0–5, menor=millor→${scoreLabel(kRow.score)}) · Dolor M/V:${kRow.dolorM}/${kRow.dolorV} · Passos:${kRow.passos||'nr'} · Fisio:${kRow.fisio||'—'} · Inflamació:${kRow.inflam||'—'} · Trigger:${kRow.trigger||'—'} · Obs:${(kRow.obs||'—').slice(0,80)}
TENDÈNCIA 7d: ${trendDelta!==null?(trendDelta>0.1?'millora':'empitjora'):'estable'} (delta:${trendDelta?.toFixed(2)||'—'}) · RISC:${risk.label} · RecoveryScore:${recScore}
Retorna ÚNICAMENT JSON amb exactament aquests 4 camps:
{"central":"10-14 paraules. Frase elegant i tranquil·la, cor emocional del dashboard. Ex: La recuperació avança amb constància i sense senyals d'alerta.",
"hero":"25-35 paraules clínic. **negreta** en dades clau. Ex: Evolució estable amb lleugera millora funcional. Persistència de sensibilitat plantar amb tolerància moderada a càrrega.",
"context":"12-18 paraules empàtiques sobre el dia, primera persona propera.",
"prediction":["bullet 12-14p properes 7-14 dies si es manté tendència","bullet sobre inflamació o fisioteràpia","bullet sobre risc o recomanació subtil"]}`;
    // IA no disponible en mode autònom — s'usen fallbacks calculats
    throw new Error('Mode autònom: fallbacks actius.');
    const m = raw.match(/\{[\s\S]*\}/);
    if (m) {
      const p = JSON.parse(m[0]);
      aiMsg = p.hero||null; aiCtx = p.context||null;
      aiPred = Array.isArray(p.prediction)?p.prediction:[];
      aiCentral = p.central||null;
    }
  } catch(e) { /* silenci */ }

  setLoadStep('Construint dashboard...');
  const insights = computeInsights(kRow, trendDelta, avg7);
  const tol = computeTolerancia();
  const zones = computeZones();
  const H = [];
  H.push('<div class="content">');

  // Banner d'estat — només si no és avui
  if (monState.cls === 'state-interrupted') {
    H.push(`<div style="background:rgba(255,107,53,0.07);border:1px solid rgba(255,107,53,0.14);border-radius:10px;padding:9px 14px;font-size:11px;color:rgba(255,107,53,0.8);margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="opacity:0.7">⚑</span> Seguiment interromput · Darrer registre dia ${last.dia}. Considera reprendre el diari.</div>`);
  } else if (monState.cls === 'state-pending') {
    H.push(`<div style="background:rgba(245,166,35,0.06);border:1px solid rgba(245,166,35,0.12);border-radius:10px;padding:9px 14px;font-size:11px;color:rgba(245,166,35,0.7);margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="opacity:0.7">📋</span> Entrada pendent per avui · Es mostra el darrer registre disponible, dia ${last.dia}.</div>`);
  }

  /* ─ ORDRE: Hero → Mètriques → Context → CORRELACIÓ → TOLERÀNCIA → Timeline → Setmanal → Insights → Historial → Taula ─ */
  H.push(buildHero(kRow, trendDelta, avg7, aiMsg, risk, recScore, monState, aiPred, aiCentral, isProvisional));
  H.push('<div class="sec-lbl">Resum del dia</div>');
  H.push(buildMetrics(kRow));
  H.push(buildAnalisiClinica());
  H.push(buildContext(kRow, aiCtx));
  H.push('<div class="sec-lbl">Correlació càrrega vs dolor · insight clínic principal</div>');
  H.push(buildCorrelacio());
  H.push('<div class="sec-lbl">Tolerància als passos · índex setmanal automàtic</div>');
  H.push(buildTolerancia(tol, zones));
  H.push('<div class="sec-lbl">Evolució temporal · confort i dolor clínic</div>');
  H.push(buildTimeline());
  H.push('<div class="sec-lbl">Tendència setmanal · visió global</div>');
  H.push(buildSetmanal());
  H.push('<div class="sec-lbl">Lectura automàtica del procés</div>');
  H.push(buildInsights(insights));
  H.push('<div class="sec-lbl">Historial mèdic</div>');
  H.push(buildVisits(ALL_EVENTS));
  H.push('<div class="sec-lbl">Comparativa setmanal detallada</div>');
  H.push(buildWeekTable());
  H.push('<div class="spacer"></div></div>');

  document.getElementById('main').innerHTML = H.join('');
  document.getElementById('appDate').textContent =
    new Date().toLocaleDateString('ca-ES',{day:'numeric',month:'long'});


  // Dibuixar totes les gràfiques
  drawPassosDolor(); // chart2 (correlació)
  drawTolerancia(tol); // chart4 (tolerància)
  drawChart();       // mainChart
  drawDolorDiari();  // chart1
  drawSetmanal();    // chart3
  drawSparkline();   // hero sparkline
}

function setLoadStep(txt) {
  const el = document.getElementById('loadStep');
  if (el) el.textContent = txt;
}

/* ══════════════════════════════════════════════
   LOAD — autònom, autònom, sense dependencies externes
══════════════════════════════════════════════ */
async function load() {
  // 1. Intentar Google Sheet URL
  if (GOOGLE_SHEET_URL) {
    try {
      setLoadStep('Carregant dades...');
      const res = await fetch(GOOGLE_SHEET_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const csv = await res.text();
      const rows = parseCSV(csv);
      if (rows.length) { await render(rows); return; }
    } catch(e) { /* continua */ }
  }
  // 2. Intentar CSV local /data/registre.csv
  try {
    setLoadStep('Buscant dades locals...');
    const res = await fetch(LOCAL_CSV_PATH, { cache: 'no-store' });
    if (!res.ok) throw new Error('No trobat');
    const csv = await res.text();
    const rows = parseCSV(csv);
    if (rows.length) { await render(rows); return; }
  } catch(e) { /* continua */ }
  // 3. Intentar localStorage (CSV guardat prèviament)
  try {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      const rows = parseCSV(saved);
      if (rows.length) {
        setLoadStep('Carregant registre guardat...');
        await render(rows);
        showSavedDataBanner();
        return;
      }
    }
  } catch(e) { /* continua */ }
  // 4. Fallback manual
  showManualCsvFallback();
}

function showSavedDataBanner() {
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border-md);border-radius:10px;padding:8px 16px;font-size:11px;color:var(--text-2);z-index:200;display:flex;gap:10px;align-items:center';
  b.innerHTML = '📂 Dades del registre guardat &nbsp;<button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:14px">×</button>';
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 4000);
}

function showManualCsvFallback() {
  document.getElementById('main').innerHTML = `
    <div class="loading-wrap"><div class="loading-card">
      <div style="font-size:32px;margin-bottom:14px">📋</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:8px;color:var(--text-1)">
        Seguiment Clínic · Peu
      </div>
      <div style="font-size:12px;color:var(--text-2);line-height:1.7;margin-bottom:20px;max-width:280px;text-align:center">
        Selecciona el teu registre CSV per veure el dashboard.<br>
        El fitxer es guardarà localment per a properes visites.
      </div>
      <label style="display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#1A0F00;
                    font-weight:700;font-size:13px;padding:12px 24px;border-radius:11px;cursor:pointer;
                    margin-bottom:12px;box-shadow:0 4px 16px rgba(245,166,35,0.3)">
        📂 Seleccionar registre CSV
        <input type="file" accept=".csv,text/csv" style="display:none"
               onchange="handleManualCsv(this.files[0])">
      </label>
      <div style="font-size:10px;color:var(--text-3);margin-top:4px">
        Exporta el teu Google Sheet com CSV i selecciona'l aquí
      </div>
    </div></div>`;
}

function handleManualCsv(file) {
  if (!file) return;
  document.getElementById('main').innerHTML =
    '<div class="loading-wrap"><div class="loading-card"><div class="load-spin"></div><div id="loadStep">Llegint fitxer...</div></div></div>';
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const csv = e.target.result;
      const rows = parseCSV(csv);
      if (!rows.length) throw new Error('El fitxer CSV no conté files llegibles.');
      try { localStorage.setItem(LS_KEY, csv); } catch(e2) { /* quota exceeded */ }
      await render(rows);
    } catch(err) {
      document.getElementById('main').innerHTML = `
        <div class="loading-wrap"><div class="loading-card">
          <div style="font-size:28px;margin-bottom:12px">⚠</div>
          <div style="font-size:13px;color:var(--text-1);margin-bottom:8px">Error llegint el fitxer</div>
          <div style="font-size:11px;color:var(--text-2)">${err.message}</div>
          <button onclick="load()" style="margin-top:16px;background:var(--amber);border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;color:#1A0F00">Tornar a intentar</button>
        </div></div>`;
    }
  };
  reader.onerror = () => showManualCsvFallback();
  reader.readAsText(file, 'UTF-8');
}

load();

/* PDF */
function savePDF() {
  const btn = document.getElementById('pdfBtn');
  if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      if (btn) { btn.textContent = '🖨️ PDF'; btn.disabled = false; }
    }, 1500);
  }, 300);
}

/* FULLSCREEN */
function toggleFS() {
  const btn = document.getElementById('fsBtn');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(()=>{ btn.textContent='✕ Sortir'; }).catch(()=>{
      document.body.style.position='fixed'; document.body.style.inset='0';
      document.body.style.zIndex='9999'; document.body.style.overflowY='auto';
      btn.textContent='✕ Reduir';
      btn.onclick=()=>{ document.body.style.position=''; document.body.style.inset=''; document.body.style.zIndex=''; btn.textContent='⛶ Pantalla completa'; btn.onclick=toggleFS; };
    });
  } else { document.exitFullscreen(); btn.textContent='⛶ Pantalla completa'; }
}
document.addEventListener('fullscreenchange',()=>{
  const btn=document.getElementById('fsBtn');
  if(btn) btn.textContent=document.fullscreenElement?'✕ Sortir':'⛶ Pantalla completa';
});
