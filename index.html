<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguiment Clínic · Peu</title>
<style>
:root {
  --bg:        #0D0D0F;
  --surface:   #18181B;
  --surface-2: #212124;
  --surface-3: #2A2A2E;
  --border:    rgba(255,255,255,0.06);
  --border-md: rgba(255,255,255,0.11);
  --border-lg: rgba(255,255,255,0.17);
  --text-1:    #F0EBE3;
  --text-2:    #8A8A90;
  --text-3:    #44444A;
  --amber:     #F5A623;
  --amber-bg:  rgba(245,166,35,0.12);
  --orange:    #FF6B35;
  --orange-bg: rgba(255,107,53,0.12);
  --green:     #2ECC71;
  --green-bg:  rgba(46,204,113,0.11);
  --red:       #FF453A;
  --red-bg:    rgba(255,69,58,0.11);
  --blue:      #5AC8FA;
  --blue-bg:   rgba(90,200,250,0.11);
  --r-sm: 10px; --r: 16px; --r-lg: 22px;
  --sh: 0 2px 16px rgba(0,0,0,0.55);
  --sh-sm: 0 1px 6px rgba(0,0,0,0.4);
  --sh-lg: 0 8px 32px rgba(0,0,0,0.7);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:'kern' 1,'liga' 1}

/* HEADER */
.app-hdr{position:sticky;top:0;z-index:100;background:rgba(13,13,15,0.94);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);padding:7px 16px;display:flex;align-items:center;justify-content:space-between}
.hdr-left{display:flex;align-items:center;gap:9px}
.hdr-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(245,166,35,0.7)}
.hdr-name{font-size:12px;font-weight:700;color:var(--text-1);letter-spacing:-0.2px}
.hdr-sub{font-size:9px;color:var(--text-2);letter-spacing:0.1px}
.hdr-right{display:flex;align-items:center;gap:7px}
.hdr-date{font-size:10px;color:var(--text-2)}
.btn-ghost{background:transparent;border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:10px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all 0.15s}
.btn-ghost:hover{color:var(--text-1);border-color:var(--border-md);background:var(--surface)}
.btn-amber{background:var(--amber);border:none;border-radius:8px;padding:5px 13px;font-size:11px;font-weight:700;color:#1A0F00;cursor:pointer;transition:all 0.15s}
.btn-amber:hover{opacity:0.88}
.btn-outline-amber{background:transparent;border:1px solid rgba(245,166,35,0.35);border-radius:7px;padding:4px 11px;font-size:10px;font-weight:600;color:var(--amber);cursor:pointer;transition:all 0.15s}
.btn-outline-amber:hover{background:rgba(245,166,35,0.07);border-color:rgba(245,166,35,0.6)}
.btn-pdf{background:transparent;border:1px solid var(--border);border-radius:7px;padding:4px 10px;font-size:10px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all 0.15s}
.btn-pdf:hover{color:var(--text-1);border-color:var(--border-md)}

/* LAYOUT */
.content{max-width:780px;margin:0 auto;padding:18px 14px 56px}
.sec-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-3);margin:28px 0 10px 2px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border);display:block}

/* HERO */
.hero{background:linear-gradient(150deg,#141009 0%,#1C1408 40%,#170D05 70%,#120D0E 100%);border:1px solid rgba(245,166,35,0.13);border-radius:var(--r-lg);padding:24px 24px 20px;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:0 4px 32px rgba(0,0,0,0.7),0 0 80px rgba(245,166,35,0.04)}
.hero::before{content:'';position:absolute;top:-80px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(245,166,35,0.13) 0%,transparent 68%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-60px;left:-30px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,107,53,0.07) 0%,transparent 70%);pointer-events:none}
.hero-top{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;margin-bottom:14px}
@media(max-width:520px){.hero-top{grid-template-columns:1fr}}
/* Comparativa avui / ahir al hero */
.hero-cmp{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin:8px 0 10px;padding:9px 11px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:9px}
.hcmp-hdr{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-3);padding-bottom:5px;grid-column:span 1}
.hcmp-hdr.today{color:rgba(245,166,35,0.6)}
.hcmp-val{font-size:14px;font-weight:700;font-feature-settings:'tnum' 1;line-height:1.1;padding:2px 0 0}
.hcmp-val.today{color:var(--text-1)}.hcmp-val.prev{color:var(--text-2)}
.hcmp-meta{font-size:8px;color:var(--text-3);padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,0.04);margin-bottom:2px}
/* Sparkline banda a banda */
.hero-spark-full{margin:0 0 14px;position:relative}
.hero-spark-full canvas{display:block;width:100%!important;height:62px}
.hero-spark-full .spark-lbl{font-size:8px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.8px;margin-top:4px;text-align:right}
.hero-left{min-width:0}
.hero-eyebrow{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(245,166,35,0.72);margin-bottom:8px}
.risk-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.3px;margin-bottom:10px;border:1px solid}
.risk-estable{background:rgba(46,204,113,0.12);color:var(--green);border-color:rgba(46,204,113,0.22)}
.risk-vigilancia{background:rgba(245,166,35,0.12);color:var(--amber);border-color:rgba(245,166,35,0.22)}
.risk-sobrecarrega{background:rgba(255,107,53,0.12);color:var(--orange);border-color:rgba(255,107,53,0.22)}
.risk-regresio{background:rgba(255,69,58,0.12);color:var(--red);border-color:rgba(255,69,58,0.22)}
.hero-score{font-size:60px;font-weight:800;letter-spacing:-3px;line-height:1;color:var(--amber);font-feature-settings:'tnum' 1}
.hero-score-label{font-size:13px;color:rgba(240,235,227,0.48);font-weight:500;margin-top:5px;letter-spacing:-0.1px}
.hero-spark{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:4px;flex-shrink:0}
#sparkline{display:block}
.spark-lbl{font-size:8px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.8px}
.hero-chips{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-top:2px;flex-shrink:0}
.hero-day-chip{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.09);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;white-space:nowrap}
.hero-trend-chip{border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;white-space:nowrap}
.trend-up{background:rgba(46,204,113,0.16);color:var(--green)}
.trend-down{background:rgba(255,69,58,0.16);color:var(--red)}
.trend-flat{background:rgba(245,166,35,0.13);color:var(--amber)}
.hero-ai-tag{font-size:10px;font-weight:500;letter-spacing:0.1px;color:rgba(240,235,227,0.48);margin-bottom:0;line-height:1.6;border-top:1px solid rgba(245,166,35,0.1);padding-top:11px}
.hero-ai-tag strong{color:rgba(240,235,227,0.75);font-weight:600}
.hero-ai-tag .tag-pos{color:var(--green)}.hero-ai-tag .tag-neg{color:var(--orange)}.hero-ai-tag .tag-key{color:rgba(245,166,35,0.8)}
.hero-ai-tag-prev{border-top:1px solid rgba(255,255,255,0.05);padding-top:7px;margin-top:5px;color:rgba(240,235,227,0.28);font-size:9.5px}
.hero-ai-tag-prev strong{color:rgba(240,235,227,0.42)}
.hero-ai-tag-prev .tag-pos{color:rgba(46,204,113,0.55)}.hero-ai-tag-prev .tag-neg{color:rgba(255,107,53,0.55)}.hero-ai-tag-prev .tag-key{color:rgba(245,166,35,0.45)}
.hero-ai-tag-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:rgba(245,166,35,0.38);margin-bottom:2px}
.hero-msg{font-size:14px;line-height:1.75;color:rgba(240,235,227,0.7);font-weight:400;font-style:italic;border-top:1px solid rgba(245,166,35,0.1);padding-top:13px}
.hero-msg strong{color:var(--text-1);font-weight:600;font-style:normal}

/* HERO REDESIGN — RECOVERY SCORE · DATA PROTAGONISTA */
/* Data: element principal editorial */
.hero-date-big{font-size:clamp(34px,7vw,48px);font-weight:700;letter-spacing:-1.5px;color:var(--text-1);line-height:1;margin-bottom:5px;font-feature-settings:'kern' 1}
/* Label "Dia 69 de recuperació" */
.hero-dia-lbl{font-size:11px;font-weight:400;color:rgba(240,235,227,0.28);letter-spacing:-0.1px;margin-bottom:11px}
/* Bloc 62% + label + text explicatiu */
.hero-rec-block{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.hero-rec-pct{font-size:clamp(36px,6vw,52px);font-weight:800;letter-spacing:-2px;color:rgba(240,235,227,0.92);line-height:1;font-feature-settings:'tnum' 1;flex-shrink:0}
.hero-rec-unit{font-size:22px;font-weight:500;opacity:0.75;margin-left:2px}
.hero-rec-desc-wrap{display:flex;flex-direction:column;gap:5px;justify-content:flex-end;padding-bottom:4px;min-width:0}
.hero-rec-desc{font-size:11px;font-weight:600;color:rgba(240,235,227,0.65);letter-spacing:-0.1px;white-space:nowrap}
.hero-rec-base{font-size:9.5px;color:rgba(240,235,227,0.38);line-height:1.6;max-width:210px}
/* Arc indicator col */
.hero-arc-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px;flex-shrink:0;gap:4px}
.hero-arc-sub{font-size:7px;font-weight:400;text-transform:uppercase;letter-spacing:0.9px;color:var(--text-3);text-align:center}
/* Estat monitorització */
.hero-state-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:rgba(240,235,227,0.45);letter-spacing:0.1px;margin-bottom:0}
.hero-state-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.state-active .hero-state-dot{background:var(--green);box-shadow:0 0 7px rgba(46,204,113,0.8);animation:hsd-pulse 2.4s ease-in-out infinite}
.state-pending .hero-state-dot{background:var(--amber)}
.state-interrupted .hero-state-dot{background:var(--orange)}
@keyframes hsd-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.35;transform:scale(0.75)}}
/* Frase IA central — cor emocional del dashboard */
.hero-ai-central{font-size:12.5px;line-height:1.7;color:rgba(240,235,227,0.58);font-weight:400;font-style:italic;margin-top:13px;border-left:1.5px solid rgba(245,166,35,0.18);padding-left:11px;max-width:260px}

/* HERO VERTICAL BAR — RECOVERY SCORE */
.hero-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:6px;flex-shrink:0}
.hero-bar-pct{font-size:11px;font-weight:700;color:var(--amber);letter-spacing:-0.3px;font-feature-settings:'tnum' 1;min-width:28px;text-align:center}
.hero-bar-track{width:5px;height:104px;background:rgba(255,255,255,0.05);border-radius:3px;position:relative;overflow:hidden}
.hero-bar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:3px;background:linear-gradient(to top,rgba(245,166,35,0.95),rgba(245,166,35,0.45));box-shadow:0 -2px 10px rgba(245,166,35,0.3);transition:height 1s cubic-bezier(0.34,1.2,0.64,1)}
.hero-bar-lbl{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-3);writing-mode:vertical-lr;transform:rotate(180deg);white-space:nowrap}

/* HERO RIGHT COL */
.hero-right-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:2px;flex-shrink:0}

/* PREDICTION BLOCK */
.pred-block{background:rgba(90,200,250,0.04);border:1px solid rgba(90,200,250,0.09);border-radius:10px;padding:10px 13px;margin-bottom:13px}
.pred-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(90,200,250,0.38);margin-bottom:7px}
.pred-items{display:flex;flex-direction:column;gap:5px}
.pred-item{font-size:11px;color:rgba(240,235,227,0.52);line-height:1.5;display:flex;align-items:flex-start;gap:7px}
.pred-item::before{content:'·';color:rgba(90,200,250,0.45);font-weight:900;font-size:14px;line-height:1.1;flex-shrink:0}

/* METRIC GRID */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media(max-width:560px){.metric-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:561px) and (max-width:700px){.metric-grid{grid-template-columns:repeat(3,1fr)}}
.mc{background:var(--surface);border-radius:var(--r-sm);padding:13px 13px 11px;box-shadow:var(--sh-sm);border:1px solid var(--border);border-left-width:3px;transition:transform 0.2s,box-shadow 0.2s,background 0.2s}
.mc:hover{background:var(--surface-2);transform:translateY(-1px);box-shadow:var(--sh)}
.mc-good{border-left-color:var(--green)!important}
.mc-ok{border-left-color:rgba(100,200,130,0.7)!important}
.mc-warn{border-left-color:var(--amber)!important}
.mc-alert{border-left-color:var(--orange)!important}
.mc-crit{border-left-color:var(--red)!important}
.mc-info{border-left-color:var(--blue)!important}
.mc-neut{border-left-color:var(--border-md)!important}
.mc-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-3);margin-bottom:7px}
.mc-value{font-size:22px;font-weight:800;line-height:1;margin-bottom:2px;font-feature-settings:'tnum' 1;letter-spacing:-0.5px}
.mc-desc{font-size:10px;color:var(--text-2);line-height:1.4;margin-top:4px}
.mc-prev{font-size:10px;color:rgba(240,235,227,0.35);margin-top:1px;letter-spacing:0;font-feature-settings:'tnum' 1}
.mc-bar{height:2px;background:rgba(255,255,255,0.07);border-radius:2px;margin-top:9px;overflow:hidden}
.mc-fill{height:100%;border-radius:2px}
.c-good{color:var(--green)}.c-ok{color:rgba(100,200,130,0.9)}.c-warn{color:var(--amber)}.c-bad{color:var(--orange)}.c-crit{color:var(--red)}.c-neut{color:var(--text-2)}.c-blue{color:var(--blue)}

/* CARD */
.card{background:var(--surface);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm);border:1px solid var(--border);margin-bottom:10px}
.card-title{font-size:13px;font-weight:700;color:var(--text-1);margin-bottom:2px;letter-spacing:-0.2px}
.card-sub{font-size:11px;color:var(--text-3);margin-bottom:14px}
.card-accent{border-color:rgba(245,166,35,0.12);box-shadow:var(--sh-sm),0 0 30px rgba(245,166,35,0.03)}

/* CHART UTILS */
.chart-divider{height:1px;background:var(--border);margin:20px 0 18px}
.chart-section-lbl{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.csl-badge{font-size:9px;padding:2px 8px;border-radius:20px;font-weight:700}
.csl-up{background:rgba(46,204,113,0.13);color:var(--green)}
.csl-down{background:rgba(255,69,58,0.13);color:var(--red)}
.csl-neut{background:rgba(255,255,255,0.06);color:var(--text-2)}
.chart-filter{display:flex;gap:6px;margin-bottom:14px}
.cfbtn{padding:4px 12px;border-radius:20px;border:1px solid var(--border-md);background:var(--surface-2);font-size:11px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all 0.15s}
.cfbtn.on{background:var(--amber);border-color:var(--amber);color:#1A0F00}
.cfbtn:hover:not(.on){border-color:var(--border-lg);color:var(--text-1)}
.chart-wrap{position:relative}
.chart-h180{height:264px}
.chart-h200{height:272px}
.chart-h160{height:196px}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;margin-bottom:2px}
.cl-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-2)}
.cl-line{width:18px;height:2px;border-radius:1px;flex-shrink:0}
.cl-zone{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.week-chart-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.wcl{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-2)}
.wcl-sq{width:9px;height:9px;border-radius:2px}

/* CORRELACIÓ CARD */
.card-corr{background:linear-gradient(145deg,#0F1215 0%,#141A20 100%);border-color:rgba(90,200,250,0.12);box-shadow:var(--sh-sm),0 0 40px rgba(90,200,250,0.025)}
.corr-insight{background:rgba(90,200,250,0.07);border:1px solid rgba(90,200,250,0.13);border-radius:8px;padding:9px 13px;font-size:11px;color:rgba(90,200,250,0.78);line-height:1.65;margin-top:10px}
.corr-insight strong{color:var(--blue);font-style:normal}

/* INSIGHTS IA */
.insights-grid{display:flex;flex-direction:column;gap:8px}
.ins{background:var(--surface);border-radius:var(--r-sm);padding:13px 15px;box-shadow:var(--sh-sm);border:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;transition:transform 0.2s,box-shadow 0.2s,background 0.2s}
.ins:hover{background:var(--surface-2);transform:translateY(-1px);box-shadow:var(--sh)}
.ins-icon{font-size:15px;flex-shrink:0;margin-top:1px;opacity:0.85}
.ins-body{flex:1;min-width:0}
.ins-title{font-size:12px;font-weight:600;color:var(--text-1);margin-bottom:3px;letter-spacing:-0.1px}
.ins-msg{font-size:11px;color:var(--text-2);line-height:1.6}
.ins-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0;letter-spacing:0.2px}
.b-good{background:var(--green-bg);color:var(--green);border:1px solid rgba(46,204,113,0.22)}
.b-warn{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,166,35,0.22)}
.b-alert{background:var(--orange-bg);color:var(--orange);border:1px solid rgba(255,107,53,0.22)}
.b-crit{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,69,58,0.22)}
.b-info{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(90,200,250,0.22)}
.ins-ai-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:rgba(245,166,35,0.35);margin-bottom:10px}

/* TIMELINE MEDIC */
.tl-wrap{position:relative;padding-left:0}
.tl-line{position:absolute;left:13px;top:14px;bottom:10px;width:1.5px;background:linear-gradient(to bottom,rgba(255,255,255,0.1),rgba(255,255,255,0.02))}
.tl-item{position:relative;display:flex;align-items:flex-start;padding-bottom:16px;padding-left:36px;cursor:default}
.tl-item:last-child{padding-bottom:0}
.tl-dot-wrap{position:absolute;left:0;top:2px;width:27px;display:flex;justify-content:center}
.tl-dot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--bg);flex-shrink:0;transition:filter 0.2s}
.tl-item:hover .tl-dot{filter:brightness(1.3)}
.tl-content{flex:1;min-width:0}
.tl-header{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.tl-date{font-size:10px;color:var(--text-3);font-weight:600;white-space:nowrap}
.tl-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--surface-2);border:1px solid;letter-spacing:0.2px;white-space:nowrap}
.tl-txt{font-size:12px;color:var(--text-2);line-height:1.55;transition:color 0.2s}
.tl-item:hover .tl-txt{color:var(--text-1)}

/* CONTEXT */
.ctx-trigger{display:inline-block;background:var(--amber-bg);color:var(--amber);font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:0.3px;border:1px solid rgba(245,166,35,0.18)}

<script>
/* ══════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════ */
// ── CONFIGURACIÓ ──────────────────────────────────────────────────────────
// Opció A: Google Sheet publicat com CSV (Fitxer → Compartir → Publica al web → CSV)
// AVÍS: Qualsevol persona amb la URL podrà veure les dades.
// Per privacitat, considera afegir autenticació al hosting.
// Google Sheet publicat com CSV — el dashboard llegirà sempre les dades més recents
// Per publicar: Fitxer → Compartir → Publica al web → Full 1 → CSV → Copia URL
const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTeqY2nkZlfF3ZnQUvJ6XCafriAmzDQzPMbKXHS_UoAJ8-73pxQvCqWH9GouXdgsxzsRJ_g03Oz2wMl/pub?output=csv';

// Opció B: Fitxer local al servidor (si puges el CSV amb el projecte)
const LOCAL_CSV_PATH = './data/registre.csv';

// localStorage key
const LS_KEY = 'peu_recovery_csv';
let ALL = [], FILTER = 30, ALL_EVENTS = [];
let CHART_OBJ = null, CHART1_OBJ = null, CHART2_OBJ = null, CHART3_OBJ = null, CHART4_OBJ = null;

/* ══════════════════════════════════════════════
   PARSERS (INTACTES)
══════════════════════════════════════════════ */
const MESOS = {
  'gen':1,'febr':2,'febre':2,'marc':3,'març':3,
  'abr':4,'abril':4,'mai':5,'maig':5,'juny':6,
  'jul':7,'juliol':7,'ag':8,'agost':8,
  'set':9,'oct':10,'nov':11,'des':12,'desembre':12
};
const MES_NOM = {1:'Gen',2:'Feb',3:'Març',4:'Abr',5:'Maig',6:'Jun',7:'Jul',8:'Ag',9:'Set',10:'Oct',11:'Nov',12:'Des'};

function b64utf8(b) {
  const bin = atob(b), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function parseDateStr(v) {
  if (!v) return null;
  const p = v.toLowerCase().trim().split('-');
  if (p.length < 2) return null;
  const d = parseInt(p[0]), m = MESOS[p[1].trim()];
  if (!m || isNaN(d)) return null;
  const iso = `2026-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  return { iso, lbl: `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}`, month: MES_NOM[m], m };
}
function pNum(v) {
  if (!v) return null;
  const s = String(v).trim();
  if (!s || s==='—'||s==='–') return null;
  const n = parseFloat(s.replace(/[?!]/g,'').replace(/\+.*/,'').trim().replace(',','.'));
  return isNaN(n) ? null : n;
}
function pSteps(v) {
  if (!v) return null;
  const s = String(v).trim();
  if (!s || s==='—') return null;
  const n = parseInt(s.replace(/[?!]/g,'').replace(/\+.*/,'').replace(/bici.*/i,'').replace(/paso+s?.*/i,'').trim().replace(/\./g,'').replace(',',''));
  return isNaN(n) ? null : n;
}
function pHours(v) {
  if (!v) return null;
  const s = String(v).trim();
  if (!s || s==='—') return null;
  const m = s.match(/(\d+)[h:](\d*)/i);
  if (m) return parseInt(m[1]) + (m[2] ? parseInt(m[2])/60 : 0);
  const n = parseFloat(s.replace(',','.'));
  return isNaN(n) ? null : n;
}
function isSi(v) { return !!(v && String(v).toLowerCase().startsWith('s')); }
function col(row, key) {
  if (row[key] !== undefined) return row[key];
  const kn = key.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  for (const k of Object.keys(row)) {
    if (k.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase() === kn) return row[k];
  }
  return '';
}
function parseCSV(raw) {
  const lines = raw.replace(/\r/g,'').split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  // Auto-detectar separador: punt-i-coma o coma
  const sep = lines[0].includes(';') ? ';' : ',';
  const hdrs = lines[0].split(sep).map(h => h.trim().replace(/^﻿/,''));
  return lines.slice(1).map(line => {
    const cols = []; let cur = '', inQ = false;
    for (const c of line) {
      if (c==='"') inQ = !inQ;
      else if (c===sep && !inQ) { cols.push(cur); cur = ''; }
      else cur += c;
    }
    cols.push(cur);
    const o = {};
    hdrs.forEach((h,i) => { o[h] = (cols[i]||'').trim(); });
    return o;
  }).filter(r => r['Data'] && r['Data'].match(/-/));
}
function parseRows(rows) {
  return rows.map(r => {
    const dp = parseDateStr(col(r,'Data'));
    return {
      iso: dp?.iso||null, lbl: dp?.lbl||col(r,'Data').slice(0,8),
      month: dp?.month||'?', m: dp?.m||0,
      dia: parseInt(col(r,'Dia'))||0,
      score: pNum(col(r,'Y numèrica')),
      passos: pSteps(col(r,'Passos')),
      son: pHours(col(r,'Son')),
      qualitat: pNum(col(r,'Qualitat')),
      magneto: pHours(col(r,'Magneto')),
      fisio: col(r,'Fisio'), exercicis: col(r,'Exercicis'),
      dolorM: pNum(col(r,'Dolor M')), dolorV: pNum(col(r,'Dolor V')),
      coixesa: pNum(col(r,'Coixesa')), inflam: pNum(col(r,'Inflamació')),
      trigger: col(r,'Trigger'), obs: col(r,'Observacions')
    };
  }).sort((a,b) => a.dia - b.dia);
}

/* ══════════════════════════════════════════════
   STATS (INTACTES)
══════════════════════════════════════════════ */
function avg(arr) {
  const v = arr.filter(x => x !== null && !isNaN(x));
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function movAvg(arr, w=7) {
  return arr.map((_,i) => {
    const sl = arr.slice(Math.max(0,i-w+1),i+1).filter(x=>x!==null);
    return sl.length ? sl.reduce((a,b)=>a+b,0)/sl.length : null;
  });
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function toComfort(score) { return score !== null ? 6 - score : null; }

/* WEEKS */
function computeWeeks(data) {
  const weeks = [];
  for (let i = 0; i < data.length; i += 7) {
    const sl = data.slice(i, i+7);
    weeks.push({
      n: Math.floor(i/7)+1,
      days: sl.map(r => r.dia),
      lbl: `S${Math.floor(i/7)+1}`,
      lblFull: `${sl[0]?.lbl}–${sl[sl.length-1]?.lbl}`,
      avgSc: avg(sl.map(r=>r.score)),
      avgDM: avg(sl.map(r=>r.dolorM)),
      avgPas: avg(sl.map(r=>r.passos)),
      totalPas: sl.reduce((s,r)=>s+(r.passos||0),0),
      fisioD: sl.filter(r=>isSi(r.fisio)).length,
      dies: sl.length
    });
  }
  return weeks;
}

/* ══════════════════════════════════════════════
   LABELS (INTACTES)
══════════════════════════════════════════════ */
function scoreLabel(v) {
  if (v===null) return '—';
  if (v<1.5) return 'Excel·lent'; if (v<2.0) return 'Molt bé';
  if (v<2.8) return 'Acceptable'; if (v<3.5) return 'Regular';
  if (v<4.5) return 'Difícil'; return 'Molt difícil';
}
function comfortLabel(c) {
  if (c===null) return '—';
  if (c>=4.5) return 'Excel·lent'; if (c>=4.0) return 'Molt bé';
  if (c>=3.2) return 'Acceptable'; if (c>=2.5) return 'Regular';
  if (c>=1.5) return 'Difícil'; return 'Molt difícil';
}
function scoreClass(v) {
  if (v===null) return 'c-neut';
  if (v<1.5) return 'c-good'; if (v<2.0) return 'c-ok';
  if (v<2.8) return 'c-warn'; if (v<3.5) return 'c-bad';
  return 'c-crit';
}
function scoreBarColor(v) {
  if (v===null) return 'var(--border-md)';
  if (v<1.5) return 'var(--green)'; if (v<2.5) return 'rgba(100,200,130,0.8)';
  if (v<3.5) return 'var(--amber)'; if (v<4.5) return 'var(--orange)';
  return 'var(--red)';
}
function scoreDotColor(v) {
  if (v===null) return 'rgba(255,255,255,0.12)';
  if (v<2) return 'var(--green)'; if (v<3) return 'rgba(100,200,130,0.9)';
  if (v<4) return 'var(--amber)'; return 'var(--red)';
}
function weekBarColor(v) {
  if (v===null) return 'rgba(100,100,100,0.3)';
  if (v < 2.0) return 'rgba(46,204,113,0.85)';
  if (v < 2.4) return 'rgba(120,200,80,0.85)';
  if (v < 2.8) return 'rgba(241,196,15,0.85)';
  if (v < 3.5) return 'rgba(230,126,34,0.85)';
  return 'rgba(192,57,43,0.85)';
}
function painLabel(v) {
  if (v===null) return '—';
  if (v<1) return 'Sense dolor'; if (v<2) return 'Lleuger';
  if (v<3) return 'Moderat'; if (v<4) return 'Significatiu';
  if (v<5) return 'Intens'; return 'Molt intens';
}
function stepsLabel(v) {
  if (!v) return 'No registrat';
  if (v<800)  return 'Repòs total';
  if (v<1800) return 'Activitat mínima';
  if (v<3000) return 'Activitat baixa';
  if (v<4000) return 'Activitat moderada';
  if (v<5500) return 'Càrrega elevada';
  return 'Càrrega intensa';
}
// Lògica clínica contextual: passos + dolor + inflamació + coixesa
function stepsClinic(passos, dolorV, inflam, coixesa) {
  if (!passos) return { lbl: 'No registrat', mcCls: 'mc-info', col: 'var(--blue)', valCls: 'c-neut' };
  const dV = dolorV || 0, inf = inflam || 0, cx = coixesa || 0;
  const highRisk = dV >= 2.5 || inf >= 2.5 || cx >= 2.5;
  const modRisk  = dV >= 1.5 || inf >= 1.5 || cx >= 1.5;
  if (passos >= 5000 && highRisk)
    return { lbl: 'Càrrega intensa · risc de sobrecàrrega', mcCls: 'mc-crit',  col: 'var(--red)',    valCls: 'c-crit' };
  if (passos >= 4200 && highRisk)
    return { lbl: 'Càrrega elevada · vigilar resposta',     mcCls: 'mc-alert', col: 'var(--orange)', valCls: 'c-bad' };
  if (passos >= 4200 && modRisk)
    return { lbl: 'Càrrega elevada · monitoritzar',         mcCls: 'mc-warn',  col: 'var(--amber)',  valCls: 'c-warn' };
  if (passos >= 4200)
    return { lbl: 'Càrrega elevada · dolor controlat',      mcCls: 'mc-info',  col: 'var(--blue)',   valCls: 'c-neut' };
  if (passos >= 3000)
    return { lbl: 'Activitat moderada',                     mcCls: 'mc-info',  col: 'var(--blue)',   valCls: 'c-neut' };
  if (passos >= 1800)
    return { lbl: 'Activitat baixa',                        mcCls: 'mc-info',  col: 'var(--blue)',   valCls: 'c-neut' };
  if (passos >= 800)
    return { lbl: 'Activitat mínima',                       mcCls: 'mc-info',  col: 'var(--blue)',   valCls: 'c-neut' };
  return { lbl: 'Repòs total',                              mcCls: 'mc-info',  col: 'var(--blue)',   valCls: 'c-neut' };
}
function sonLabel(v) {
  if (!v) return '—';
  if (v<5) return 'Insuficient'; if (v<6.5) return 'Curt';
  if (v<7.5) return 'Acceptable'; if (v<9) return 'Bé';
  return 'Molt bé';
}
function fmtH(h) {
  if (!h) return '—';
  const hh = Math.floor(h), mm = Math.round((h%1)*60);
  return `${hh}h${mm?mm+'m':''}`;
}

/* ══════════════════════════════════════════════
   DETECTORS (INTACTES)
══════════════════════════════════════════════ */
const VISIT_KW = [
  { re: /fisioterapeuta|fisio nova|fisio (amb|sessi)/i, tag: 'Fisio', col: '#2ECC71', chartCol: 'rgba(46,204,113,0.8)' },
  { re: /traum[aà]|dr\.?\s*ri[oó]s|dr\.?\s*jord[aà]/i, tag: 'Traumatologia', col: '#F5A623', chartCol: 'rgba(245,166,35,0.8)' },
  { re: /infilt/i, tag: 'Infiltració', col: '#FF453A', chartCol: 'rgba(255,69,58,0.8)' },
  { re: /rx|radiog|ecog|rm\b/i, tag: 'Prova imatge', col: '#8E8E93', chartCol: 'rgba(142,142,147,0.8)' },
  { re: /visita|cita|metge|doctor/i, tag: 'Visita', col: '#2ECC71', chartCol: 'rgba(46,204,113,0.8)' },
  { re: /podol/i, tag: 'Podologia', col: '#FF6B35', chartCol: 'rgba(255,107,53,0.8)' },
];
function detectVisits(all) {
  const visits = [];
  for (const r of all) {
    const txt = (r.obs + ' ' + r.trigger).toLowerCase();
    for (const kw of VISIT_KW) {
      if (kw.re.test(txt)) {
        visits.push({ lbl: r.lbl, iso: r.iso, dia: r.dia, txt: (r.obs||r.trigger||'').slice(0,90), tag: kw.tag, col: kw.col, chartCol: kw.chartCol });
        break;
      }
    }
  }
  return visits;
}
function detectWorstDays(data, n=5) {
  const peaks = [];
  for (let i=1; i<data.length-1; i++) {
    const sc = data[i].score;
    if (sc===null) continue;
    const prev = data[i-1].score, next = data[i+1].score;
    if (prev!==null && next!==null && sc >= prev && sc >= next && sc > 3.0) {
      peaks.push({ idx:i, score:sc, dia:data[i].dia, lbl:data[i].lbl });
    }
  }
  peaks.sort((a,b) => b.score-a.score);
  return peaks.slice(0,n).sort((a,b) => a.dia-b.dia);
}

/* ══════════════════════════════════════════════
   RISK BADGE (NOU)
══════════════════════════════════════════════ */
function computeRisk(kRow, trendDelta) {
  const sc = kRow.score;
  if (sc === null) return { cls:'risk-estable', label:'Sense dades', icon:'·' };
  const prev7avgPas = avg(ALL.slice(-8,-1).map(r=>r.passos));
  const highLoad = prev7avgPas && kRow.passos && kRow.passos > prev7avgPas * 1.4;
  const recentPeaks = detectWorstDays(ALL.slice(-10), 3);
  if (sc >= 3.8 || (trendDelta !== null && trendDelta < -0.45))
    return { cls:'risk-regresio', label:'Regressió', icon:'↓' };
  if (highLoad && sc >= 2.8)
    return { cls:'risk-sobrecarrega', label:'Sobrecàrrega', icon:'⚡' };
  if (sc >= 2.8 || recentPeaks.length >= 2 || (trendDelta !== null && trendDelta < -0.2))
    return { cls:'risk-vigilancia', label:'Vigilància', icon:'→' };
  return { cls:'risk-estable', label:'Estable', icon:'↑' };
}

/* ══════════════════════════════════════════════
   RECOVERY SCORE 0–100
══════════════════════════════════════════════ */
function computeRecoveryScore(kRow, trendDelta) {
  if (kRow.score === null) return null;
  // Dolor (0-50): component principal
  const painComp = Math.max(0, (1 - kRow.score / 5)) * 50;
  // Coixesa (0-15)
  const coixComp = kRow.coixesa !== null ? Math.max(0,(1-kRow.coixesa/5))*15 : 7;
  // Inflamació (0-10)
  const inflamComp = kRow.inflam !== null ? Math.max(0,(1-kRow.inflam/5))*10 : 5;
  // Passos (0-10): fins 6000 passos = màxim
  const stepsComp = kRow.passos ? Math.min(kRow.passos/6000,1)*10 : 0;
  // Son (0-5)
  const sleepComp = kRow.son ? Math.min(kRow.son/8,1)*5 : 2.5;
  // Tendència (-10 a +10)
  const trendBonus = trendDelta !== null ? Math.max(-10,Math.min(10,trendDelta*20)) : 0;
  // Penalització recaigudes recents
  const recentRows = ALL.slice(-7).filter(r=>r.score!==null);
  const peaks = recentRows.filter(r=>r.score>=3.5).length;
  const relapsePenalty = peaks * 3;
  return Math.round(Math.min(100,Math.max(0,
    painComp + coixComp + inflamComp + stepsComp + sleepComp + trendBonus - relapsePenalty
  )));
}

/* ══════════════════════════════════════════════
   ESTAT MONITORITZACIÓ
══════════════════════════════════════════════ */
function getMonitoringState(kRow, today) {
  if (!kRow.iso) return { label: 'Seguiment actiu', cls: 'state-active' };
  if (kRow.iso === today) return { label: 'Monitorització activa', cls: 'state-active' };
  // Compara hores des del darrer registre (assumim entrada a les 20h)
  const lastDate = new Date(kRow.iso + 'T20:00:00');
  const now = new Date();
  const diffH = (now - lastDate) / (1000 * 60 * 60);
  // Dins de les primeres 16h (matí següent): seguiment actiu, registre previst al vespre
  if (diffH < 16) return { label: 'Registre previst al vespre', cls: 'state-active' };
  // 16-28h: entrada pendent (probablement han passat 24h)
  if (diffH < 28) return { label: 'Dades del dia anterior', cls: 'state-active' };
  // 28-60h: realment pendent
  if (diffH < 60) return { label: 'Entrada pendent', cls: 'state-pending' };
  return { label: 'Seguiment interromput', cls: 'state-interrupted' };
}

/* ══════════════════════════════════════════════
   SPARKLINE (NOU)
══════════════════════════════════════════════ */
function drawSparkline() {
  const canvas = document.getElementById('sparkline');
  if (!canvas) return;
  const data = ALL.slice(-14).filter(r => r.score !== null);
  if (data.length < 3) return;
  const W = canvas.offsetWidth || 640;
  const H = 62;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const vals = data.map(r => r.score);
  const minV = Math.min(...vals) - 0.15;
  const maxV = Math.max(...vals) + 0.15;
  const range = maxV - minV || 0.5;
  const pts = vals.map((v, i) => ({
    x: 4 + (i / (vals.length - 1)) * (W - 8),
    y: H - 5 - ((v - minV) / range) * (H - 10)
  }));
  // Gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(245,166,35,0.25)');
  grad.addColorStop(1, 'rgba(245,166,35,0.01)');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const cpx = (pts[i-1].x + pts[i].x) / 2;
    ctx.bezierCurveTo(cpx, pts[i-1].y, cpx, pts[i].y, pts[i].x, pts[i].y);
  }
  ctx.lineTo(pts[pts.length-1].x, H);
  ctx.lineTo(pts[0].x, H);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  // Line amb glow premium
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    const cpx = (pts[i-1].x + pts[i].x) / 2;
    ctx.bezierCurveTo(cpx, pts[i-1].y, cpx, pts[i].y, pts[i].x, pts[i].y);
  }
  ctx.strokeStyle = 'rgba(245,166,35,0.85)';
  ctx.lineWidth = 2.2;
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'rgba(245,166,35,0.45)';
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.shadowColor = 'transparent';
  // Trend dashed line
  if (pts.length >= 5) {
    const firstAvg = avg(vals.slice(0, 3));
    const lastAvg = avg(vals.slice(-3));
    const tColor = lastAvg < firstAvg ? 'rgba(46,204,113,0.4)' : 'rgba(255,69,58,0.4)';
    const y1 = H - 5 - ((firstAvg - minV) / range) * (H - 10);
    const y2 = H - 5 - ((lastAvg - minV) / range) * (H - 10);
    ctx.beginPath();
    ctx.moveTo(pts[0].x, y1);
    ctx.lineTo(pts[pts.length-1].x, y2);
    ctx.strokeStyle = tColor;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 2]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // Last dot
  const last = pts[pts.length-1];
  ctx.beginPath();
  ctx.arc(last.x, last.y, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = '#F5A623';
  ctx.fill();
}

/* ══════════════════════════════════════════════

══════════════════════════════════════════════ */
function makeEventsPlugin(id, eventsRef, labelsRef, showLabel=true) {
  return {
    id,
    afterDraw(chart) {
      const evs = eventsRef();
      if (!evs.length) return;
      const lbls = labelsRef();
      const { ctx:c, chartArea, scales } = chart;
      if (!chartArea || !scales.x) return;
      c.save();
      c.setLineDash([4,3]); c.lineWidth = 1.5;
      for (const ev of evs) {
        const idx = lbls.indexOf(ev.lbl);
        if (idx < 0) continue;
        const x = scales.x.getPixelForTick(idx);
        if (x === undefined) continue;
        c.strokeStyle = ev.chartCol; c.globalAlpha = 0.6;
        c.beginPath(); c.moveTo(x, chartArea.top); c.lineTo(x, chartArea.bottom); c.stroke();
        if (showLabel) {
          c.globalAlpha = 0.8; c.setLineDash([]);
          c.font = 'bold 8px -apple-system,sans-serif'; c.fillStyle = ev.chartCol;
          c.save(); c.translate(x-3, chartArea.top+6); c.rotate(-Math.PI/2);
          c.fillText(ev.tag.slice(0,11), 0, 0); c.restore();
          c.setLineDash([4,3]);
        }
      }
      c.restore();
    }
  };
}

function makeWorstPlugin(dataRef, labelsRef) {
  return {
    id: 'worstDays',
    afterDraw(chart) {
      const fd = dataRef(), lbls = labelsRef();
      const worst = detectWorstDays(fd, 5);
      if (!worst.length) return;
      const { ctx:c, chartArea, scales } = chart;

      c.save();

        c.fillStyle = '#FFF'; c.textAlign='center'; c.textBaseline='middle';
        c.fillText(String(ni+1), x, y);
      });
      c.restore();
    }
  };
}

/* Resum clínic narratiu: evolució dolor + lectura de passos */
function buildClinicTag(kRow, prevH, trendDelta) {
  const sc = kRow.score;
  const prevSc = prevH ? prevH.score : null;
  const pas = kRow.passos || 0;
  const pasK = pas >= 1000 ? `${(pas/1000).toFixed(1)}k` : (pas ? `${pas}` : null);
  const prevPas = prevH ? (prevH.passos || 0) : 0;
  const scDelta = (sc !== null && prevSc !== null) ? +(sc - prevSc).toFixed(2) : null;

  // Si no tenim comparativa
  if (scDelta === null) {
    return `◈ Dolor Y ${sc !== null ? sc.toFixed(2) : '—'}/5 · ${scoreLabel(sc)}`;
  }

  // Part 1: evolució del dolor
  let trendPart, trendTag;
  if (scDelta < -0.15) {
    trendPart = `↓ <strong>−${Math.abs(scDelta)}</strong> vs ahir`;
    trendTag  = `<span class="tag-pos">millora</span>`;
  } else if (scDelta > 0.3) {
    trendPart = `↑ <strong>+${scDelta}</strong> vs ahir`;
    trendTag  = `<span class="tag-neg">regressió</span>`;
  } else if (scDelta > 0.05) {
    trendPart = `↑ <strong>+${scDelta}</strong> vs ahir`;
    trendTag  = `<span class="tag-neg">lleu empitjorament</span>`;
  } else {
    trendPart = `→ dolor <strong>estable</strong> vs ahir`;
    trendTag  = '';
  }

  // Part 2: lectura de passos + resposta al dolor (el patró clínic clau)
  let pasPart = '';
  if (pasK) {
    const highLoad = pas >= 4000;
    const veryHighLoad = pas >= 5500;
    const containedResponse = scDelta < 0.25; // dolor no dispara malgrat l'activitat
    const goodTolerance = highLoad && containedResponse;
    const overload = highLoad && scDelta > 0.35;
    const prevHighLoad = prevPas >= 4000;

    if (veryHighLoad && containedResponse) {
      pasPart = ` · <span class="tag-key">${pasK} passos</span> amb resposta de dolor continguda → <span class="tag-pos">tolerància funcional alta</span>`;
    } else if (goodTolerance) {
      pasPart = ` · <span class="tag-key">${pasK} passos</span> amb increment mínim de dolor → <span class="tag-pos">bona tolerància funcional</span>`;
    } else if (overload) {
      pasPart = ` · <span class="tag-key">${pasK} passos</span> → <span class="tag-neg">possible sobrecàrrega, revisar càrrega</span>`;
    } else if (highLoad) {
      pasPart = ` · <span class="tag-key">${pasK} passos</span>`;
    } else if (pasK) {
      pasPart = ` · ${pasK} passos`;
    }
  }

  // Part 3: tendència 7d si rellevant
  let trend7Part = '';
  if (trendDelta !== null && Math.abs(trendDelta) > 0.2) {
    trend7Part = trendDelta > 0
      ? ` · tendència 7d: <span class="tag-pos">millora sostinguda</span>`
      : ` · tendència 7d: <span class="tag-neg">vigilar regressions</span>`;
  }

  return `◈ ${trendPart}${trendTag ? ' · ' + trendTag : ''}${pasPart}${trend7Part}`;
}

function buildHero(kRow, trendDelta, avg7, aiMsg, risk, recScore, monState, prediction, aiCentral, isProvisional) {
  const sc = kRow.score;

  // Trend chip: avui vs AHIR exacte (no mitjana 7d)
  // Score 0–5: menor = millor. Si avui < ahir → dolor baixa → millora (verd)
  const kIdxH = ALL.findIndex(r => r.dia === kRow.dia);
  const prevH     = kIdxH > 0 ? ALL[kIdxH - 1] : null;
  const prevPrevH = kIdxH > 1 ? ALL[kIdxH - 2] : null;
  let trendTxt, trendCls;
  if (prevH && prevH.score !== null && sc !== null) {
    const d = +(sc - prevH.score).toFixed(2);
    if (d < -0.1) {
      trendCls = 'trend-up';
      trendTxt = `↓ −${Math.abs(d)} vs ahir`;
    } else if (d > 0.4) {
      trendCls = 'trend-down';
      trendTxt = `↑ +${d} vs ahir`;
    } else if (d > 0.1) {
      trendCls = 'trend-flat';
      trendTxt = `↑ +${d} vs ahir`;
    } else {
      trendCls = 'trend-flat';
      trendTxt = `→ Similar a ahir`;
    }
  } else {
    trendCls = 'trend-flat';
    trendTxt = trendDelta !== null
      ? (trendDelta > 0.15 ? `7d ↓ millora` : trendDelta < -0.15 ? `7d ↑ empitjora` : `→ Estable`)
      : '→ Sense dades';
  }
  const msgHtml = aiMsg
    ? aiMsg.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    : `Dolor Y (escala 0–5, on 0 = sense dolor): <strong>${sc?.toFixed(2)||'—'}</strong> · ${scoreLabel(sc)}. El ${recScore!==null?recScore+'%':'—'} de recuperació funcional integra dolor, activitat física i evolució clínica.</span>`;

  // Data: protagonista visual principal
  const d = kRow.iso ? new Date(kRow.iso + 'T12:00:00') : null;
  const dateDisplay = d
    ? `${d.getDate()} DE ${d.toLocaleDateString('ca-ES',{month:'long'}).toUpperCase()}`
    : '';

  // Frase IA central — prioritza evolució avui vs ahir (no etiqueta estàtica del valor actual)
  const centralFallback = (() => {
    if (sc === null) return 'La recuperació avança pas a pas.';
    const prevSc = prevH ? prevH.score : null;
    const scDelta = (prevSc !== null) ? +(sc - prevSc).toFixed(2) : null;
    const prevWasHigh = prevSc !== null && prevSc >= 3.0;
    const prevWasMod  = prevSc !== null && prevSc >= 2.2;

    // Post-episodi agut: ahir va punxar, avui millora
    if (scDelta !== null && scDelta < -0.3 && prevWasHigh)
      return 'Recuperació progressiva després d\'un episodi d\'alta intensitat. La simptomatologia millora respecte ahir, tot i que el procés segueix actiu.';
    if (scDelta !== null && scDelta < -0.15 && prevWasMod)
      return 'Millora clara respecte ahir. La recuperació avança, tot i que el cos encara processa l\'episodi anterior.';
    // Millora lleugera
    if (scDelta !== null && scDelta < -0.05)
      return 'Lleugera millora respecte ahir. La tendència és positiva, la constància terapèutica és clau.';
    // Regressió
    if (scDelta !== null && scDelta > 0.4)
      return 'Increment de dolor respecte ahir. Revisar l\'activitat recent i els factors desencadenants.';
    if (scDelta !== null && scDelta > 0.15)
      return 'Lleugera regressió respecte ahir. Mantenir el pla terapèutic i vigilar la càrrega.';
    // Estable — ara per nivell actual
    if (sc < 1.8) return 'El dolor es manté en nivells molt controlats. Bon moment per consolidar progressos.';
    if (sc < 2.5) return 'La recuperació avança amb constància i sense senyals d\'alerta.';
    if (sc < 3.5) return 'Estabilitat clínica. Seguir el pla de fisioteràpia i monitoritzar la resposta a la càrrega.';
    return 'El dolor persisteix. Prioritzar repòs i seguiment del pla terapèutic.';
  })();
  const centralHtml = `<div class="hero-ai-central">${aiCentral || centralFallback}</div>`;

  // Arc SVG — indicador funcional orientatiu (subtil, clínic)
  const R = 22, C = +(2 * Math.PI * R).toFixed(2);
  const arcLen = recScore !== null ? +((recScore/100)*C).toFixed(2) : 0;
  const arcSvg = recScore !== null ? [
    '<svg viewBox="0 0 56 56" width="52" height="52" style="display:block">',
    `<circle cx="28" cy="28" r="${R}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>`,
    `<circle cx="28" cy="28" r="${R}" fill="none" stroke="rgba(245,166,35,0.5)" stroke-width="2"`,
    ` stroke-dasharray="${arcLen} ${+(C-arcLen).toFixed(2)}"`,
    ` stroke-linecap="round" transform="rotate(-90 28 28)"/>`,
    `<text x="28" y="32" text-anchor="middle" fill="rgba(240,235,227,0.6)"`,
    ` font-size="10" font-weight="600" font-family="-apple-system,sans-serif">${recScore}</text>`,
    '</svg>'
  ].join('') : '';

  // Predicció IA

function mcColorClass(val, type) {
  if (type === 'steps') {
    return 'mc-info'; // passos: sempre blau/neutre — mètrica informativa, no valorativa
  }
  if (type === 'son') {
    if (!val) return 'mc-info';
    if (val >= 7.5) return 'mc-good';
    if (val >= 6.5) return 'mc-ok';
    if (val >= 5) return 'mc-warn';
    return 'mc-alert';
  }
  if (type === 'bool') return val ? 'mc-good' : 'mc-neut';
  if (type === 'magneto') return 'mc-info';
  if (val === null) return 'mc-neut';
  if (val < 1.5) return 'mc-good';
  if (val < 2.5) return 'mc-ok';
  if (val < 3.5) return 'mc-warn';
  if (val < 4.5) return 'mc-alert';
  return 'mc-crit';
}

function buildMetrics(kRow) {
  // Dia anterior per tendència passos
  const kIdx = ALL.findIndex(r => r.dia === kRow.dia);
  const prev = kIdx > 0 ? ALL[kIdx - 1] : null;

  // Passos: avaluació clínica contextual (dolor V + inflamació + coixesa)
  const sc_pas = stepsClinic(kRow.passos, kRow.dolorV, kRow.inflam, kRow.coixesa);
  let stepsDesc = sc_pas.lbl;
  if (kRow.passos !== null && prev && prev.passos !== null) {
    const diff = kRow.passos - prev.passos;
    const pct = Math.abs(Math.round((diff / prev.passos) * 100));
    if (diff > 150)       stepsDesc = `↑ +${pct}% vs ahir · ${sc_pas.lbl}`;
    else if (diff < -150) stepsDesc = `↓ −${pct}% vs ahir · ${sc_pas.lbl}`;
    else                  stepsDesc = `→ Similar a ahir · ${sc_pas.lbl}`;
  }

  // Coixesa: descripció de la marxa
  const coixesaDesc = kRow.coixesa !== null
    ? (kRow.coixesa < 0.5 ? 'Marxa normal' : kRow.coixesa < 1 ? 'Molt lleu' : kRow.coixesa < 2 ? 'Lleugera' : kRow.coixesa < 3 ? 'Moderada' : 'Marcada')
    : '—';

  // Teràpia (fisio + exercicis combinats → allibera 1 targeta per dolor M/V)
  const terapiaVal = isSi(kRow.fisio) ? 'Fisio ✓' : (kRow.fisio && kRow.fisio !== '—' ? 'Parcial' : 'No');
  const terapiaDesc = isSi(kRow.exercicis) ? 'Exercicis completats' : 'Sense exercicis';
  const terapiaPct = (isSi(kRow.fisio) ? 50 : 0) + (isSi(kRow.exercicis) ? 50 : 0);

  // Valors dia anterior per a cada mètrica
  const p = prev; // alias curt
  const fmtPas = v => v != null ? (v >= 1000 ? (v/1000).toFixed(1)+'k' : v) : null;

  const cards = [
    { lbl:'Dolor matí',   val:kRow.dolorM!==null?kRow.dolorM.toFixed(1):'—',  prevTxt:p&&p.dolorM!==null?`ahir ${p.dolorM.toFixed(1)}`:null, desc:painLabel(kRow.dolorM),  pct:kRow.dolorM!==null?(kRow.dolorM/5)*100:0,  col:scoreBarColor(kRow.dolorM),  cls:scoreClass(kRow.dolorM),  mcCls:mcColorClass(kRow.dolorM,null) },
    { lbl:'Dolor vespre', val:kRow.dolorV!==null?kRow.dolorV.toFixed(1):'—',  prevTxt:p&&p.dolorV!==null?`ahir ${p.dolorV.toFixed(1)}`:null, desc:painLabel(kRow.dolorV),  pct:kRow.dolorV!==null?(kRow.dolorV/5)*100:0,  col:scoreBarColor(kRow.dolorV),  cls:scoreClass(kRow.dolorV),  mcCls:mcColorClass(kRow.dolorV,null) },
    { lbl:'Coixesa',      val:kRow.coixesa!==null?kRow.coixesa.toFixed(1):'—', prevTxt:p&&p.coixesa!==null?`ahir ${p.coixesa.toFixed(1)}`:null, desc:coixesaDesc, pct:kRow.coixesa!==null?(kRow.coixesa/5)*100:0, col:scoreBarColor(kRow.coixesa), cls:scoreClass(kRow.coixesa), mcCls:mcColorClass(kRow.coixesa,null) },
    { lbl:'Passos',       val:kRow.passos!==null?(kRow.passos>=1000?(kRow.passos/1000).toFixed(1)+'k':kRow.passos):'—', prevTxt:p&&p.passos!=null?`ahir ${fmtPas(p.passos)}`:null, desc:stepsDesc, pct:kRow.passos!==null?Math.min(100,(kRow.passos/6000)*100):0, col:sc_pas.col, cls:sc_pas.valCls, mcCls:sc_pas.mcCls },
    { lbl:'Inflamació',   val:kRow.inflam!==null?kRow.inflam.toFixed(1):'—',   prevTxt:p&&p.inflam!==null?`ahir ${p.inflam.toFixed(1)}`:null, desc:kRow.inflam!==null?(kRow.inflam<1?'Cap':kRow.inflam<2?'Mínima':kRow.inflam<3?'Lleugera':kRow.inflam<4?'Moderada':'Alta'):'—', pct:kRow.inflam!==null?(kRow.inflam/5)*100:0, col:'var(--orange)', cls:kRow.inflam!==null?(kRow.inflam<2?'c-good':kRow.inflam<3?'c-warn':'c-bad'):'c-neut', mcCls:mcColorClass(kRow.inflam,null) },
    { lbl:'Son',          val:fmtH(kRow.son),    prevTxt:p&&p.son!=null?`ahir ${fmtH(p.son)}`:null, desc:sonLabel(kRow.son)+(kRow.qualitat!==null?` · qualitat ${kRow.qualitat}%`:''), pct:kRow.son!==null?Math.min(100,(kRow.son/9)*100):0, col:'var(--blue)', cls:'c-blue', mcCls:mcColorClass(kRow.son,'son') },
    { lbl:'Magneto',      val:fmtH(kRow.magneto), prevTxt:p&&p.magneto!=null?`ahir ${fmtH(p.magneto)}`:null, desc:'Magnetoteràpia', pct:kRow.magneto!==null?Math.min(100,(kRow.magneto/3)*100):0, col:'var(--blue)', cls:'c-blue', mcCls:'mc-info' },
    { lbl:'Teràpia',      val:terapiaVal, prevTxt:null, desc:terapiaDesc, pct:terapiaPct, col:'var(--green)', cls:isSi(kRow.fisio)?'c-good':'c-neut', mcCls:(isSi(kRow.fisio)||isSi(kRow.exercicis))?'mc-good':'mc-neut' }
  ];
  return `<div class="metric-grid">${cards.map(c=>`
    <div class="mc ${c.mcCls}">
      <div class="mc-label">${c.lbl}</div>
      <div class="mc-value ${c.cls}">${c.val}</div>
      ${c.prevTxt ? `<div class="mc-prev">${c.prevTxt}</div>` : ''}
      <div class="mc-desc">${c.desc}</div>
      <div class="mc-bar"><div class="mc-fill" style="width:${c.pct}%;background:${c.col}"></div></div>
    </div>`).join('')}</div>`;
}

/* ── CORRELACIÓ CÀRREGA/DOLOR (PROTAGONISTA - POSICIÓ #1) ── */
function buildCorrelacio() {
  const highDays = ALL.filter(r => r.passos > 3500 && r.score !== null);
  const lowDays = ALL.filter(r => r.passos !== null && r.passos < 2500 && r.score !== null);
  let corrHtml = '';
  if (highDays.length >= 3 && lowDays.length >= 3) {
    const avgH = avg(highDays.map(r=>r.score));
    const avgL = avg(lowDays.map(r=>r.score));
    const diff = avgH - avgL;
    const txt = diff > 0.3
      ? `Patró detectat: dies amb >3.500 passos mostren un score mig de <strong>${avgH.toFixed(2)}</strong> vs <strong>${avgL.toFixed(2)}</strong> en dies de baixa càrrega. La sobrecàrrega funcional s'associa a major intensitat de dolor.`
      : diff < -0.1
      ? `Tolerància funcional positiva: dies d'alta activitat (>3.500 passos) no s'associen a major dolor (score ${avgH.toFixed(2)} vs ${avgL.toFixed(2)}). Progressió funcional favorable.`
      : `Correlació moderada entre càrrega i dolor. Score similar en dies d'alta (${avgH.toFixed(2)}) i baixa activitat (${avgL.toFixed(2)}).`;
    corrHtml = `<div class="corr-insight">${txt}</div>`;
  }
  return `<div class="card card-corr">
    <div class="card-title" style="color:var(--blue)">Càrrega vs Dolor · Correlació Funcional</div>
    <div class="card-sub">Eix esquerre: Dolor Y 0–5 · Eix dret: Passos · Retard de resposta 24–48h</div>

    <div class="chart-legend">

      <div class="cl-item" style="font-size:9px;color:var(--text-3)">⚠ Barres altes → risc pic dolor +24–48h</div>

/* ══════════════════════════════════════════════
   CHARTS (LÒGICA INTACTA)
══════════════════════════════════════════════ */
function drawChart() {
  const canvas = document.getElementById('mainChart');
  if (!canvas) return;
  if (CHART_OBJ) { CHART_OBJ.destroy(); CHART_OBJ = null; }
  const fd = FILTER==='all' ? ALL : ALL.slice(-FILTER);
  const labels = fd.map(r => r.lbl);
  const comforts = fd.map(r => toComfort(r.score));
  const maComfort = movAvg(comforts, 7);
  const fdDias = new Set(fd.map(r => r.dia));
  const eventsInRange = ALL_EVENTS.filter(e => fdDias.has(e.dia));
  const worstInRange = detectWorstDays(fd, 5);
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,264);
  grad.addColorStop(0,'rgba(245,166,35,0.16)');
  grad.addColorStop(0.55,'rgba(245,166,35,0.04)');
  grad.addColorStop(1,'rgba(245,166,35,0)');
  const worstPlugin = {
    id: 'worstDaysC',
    afterDraw(chart) {
      if (!worstInRange.length) return;
      const { ctx:c, chartArea, scales } = chart;
      if (!chartArea) return;
      c.save();
      worstInRange.forEach((wp,ni) => {
        const idx = fd.findIndex(r => r.dia===wp.dia);
        if (idx<0) return;
        const comfort = toComfort(wp.score);
        const x = scales.x.getPixelForTick(idx), y = scales.y.getPixelForValue(comfort);
        if (x===undefined||y===undefined) return;
        c.beginPath(); c.arc(x,y,8,0,Math.PI*2);
        c.fillStyle='rgba(255,69,58,0.82)'; c.fill();
        c.strokeStyle='rgba(255,255,255,0.18)'; c.lineWidth=1; c.stroke();
        c.font='bold 9px -apple-system,sans-serif';
        c.fillStyle='#FFF'; c.textAlign='center'; c.textBaseline='middle';
        c.fillText(String(ni+1),x,y);
      });
      c.restore();
    }
  };
  CHART_OBJ = new Chart(canvas, {
    type:'line',

/* ══════════════════════════════════════════════
   TOLERÀNCIA ALS PASSOS
══════════════════════════════════════════════ */
function computeTolerancia() {
  const weeks = computeWeeks(ALL);
  return weeks.map(w => {
    const wDays = ALL.filter(r => w.days.includes(r.dia) && r.passos !== null && r.score !== null && r.score > 0);
    if (wDays.length < 2) return { n: w.n, lbl: w.lbl, lblFull: w.lblFull, index: null, avgPas: w.avgPas, avgSc: w.avgSc, threshold: null, dies: wDays.length };
    const avgPas = avg(wDays.map(r => r.passos));
    const avgSc  = avg(wDays.map(r => r.score));
    const index  = avgSc > 0 ? Math.round(avgPas / avgSc) : null;
    const goodDays = wDays.filter(r => r.score <= 2.5);
    const threshold = goodDays.length > 0 ? Math.max(...goodDays.map(r => r.passos)) : null;
    return { n: w.n, lbl: w.lbl, lblFull: w.lblFull, index, avgPas, avgSc, threshold, dies: wDays.length };
  });
}

function computeZones() {
  const zones = [
    { label: '<1.5k passos', min: 0, max: 1500 },
    { label: '1.5–3k passos', min: 1500, max: 3000 },
    { label: '3–4.5k passos', min: 3000, max: 4500 },
    { label: '>4.5k passos', min: 4500, max: Infinity },
  ];
  return zones.map(z => {
    const days = ALL.filter(r => r.passos !== null && r.score !== null && r.passos >= z.min && r.passos < z.max);
    return { label: z.label, count: days.length, avgScore: days.length ? avg(days.map(r => r.score)) : null };
  });
}

function buildTolerancia(tol, zones) {
  const validTol = tol.filter(w => w.index !== null);
  // Lògica de tendència
  let summaryHtml = '';
  if (validTol.length >= 2) {
    const first3 = validTol.slice(0, Math.min(3, validTol.length));
    const last3  = validTol.slice(-Math.min(3, validTol.length));
    const avgFirst = avg(first3.map(w => w.index));
    const avgLast  = avg(last3.map(w => w.index));
    const lastW = validTol[validTol.length - 1];
    const prevW = validTol[validTol.length - 2];
    const weekDelta = lastW && prevW && lastW.index && prevW.index ? lastW.index - prevW.index : null;
    const trend = avgLast > avgFirst * 1.1 ? '↑ Tolerància creixent' : avgLast < avgFirst * 0.9 ? '↓ Tolerància decreixent' : '→ Tolerància estable';
    const bestW = [...validTol].sort((a,b) => (b.index||0)-(a.index||0))[0];
    const thresholdW = validTol.filter(w => w.threshold !== null).slice(-1)[0];
    const thresholdTxt = thresholdW ? `Llindar de confort actual (dolor ≤2.5): <strong>≤${thresholdW.threshold.toLocaleString('ca-ES')} passos</strong>.` : '';
    const deltaNote = weekDelta !== null ? ` Variació setmana actual vs anterior: <strong>${weekDelta > 0 ? '+' : ''}${weekDelta.toLocaleString('ca-ES')} pas/punt dolor</strong>.` : '';
    summaryHtml = `<div class="tol-summary">${trend}. Índex màxim registrat: <strong>${bestW?.lbl} (${bestW?.index?.toLocaleString('ca-ES')} passos/punt dolor)</strong>. ${thresholdTxt}${deltaNote}</div>`;
  }

  // Zones de dolor per rang de passos
  const zoneColors = ['rgba(46,204,113,0.75)','rgba(241,196,15,0.75)','rgba(255,107,53,0.75)','rgba(255,69,58,0.75)'];
  const zonesHtml = zones.map((z,i) => {
    const c = z.avgScore !== null ? scoreClass(z.avgScore) : 'c-neut';
    return `<div class="tol-zone">
      <div class="tol-zone-lbl">${z.label}</div>
      <div class="tol-zone-count" style="color:${zoneColors[i]}">${z.count}</div>
      <div class="tol-zone-score ${c}">${z.avgScore !== null ? 'dolor mig ' + z.avgScore.toFixed(2) : '—'}</div>
    </div>`;
  }).join('');

  return `<div class="card tol-card">
    <div class="card-title" style="color:var(--blue)">Tolerància als Passos · Índex Setmanal</div>
    <div class="card-sub">Càlcul automàtic: passos mig / dolor mig per setmana · evolució de la tolerància funcional</div>
    <div class="chart-wrap chart-h200"><canvas id="chart4"></canvas></div>
    <div class="chart-legend">
      <div class="cl-item"><div class="cl-line" style="background:var(--blue)"></div>Índex tolerància (passos/punt dolor) · eix esq.</div>
      <div class="cl-item"><div class="cl-zone" style="background:rgba(46,204,113,0.5)"></div>Passos mig setmanal · eix dret</div>
    </div>
    <div class="sec-lbl" style="margin-top:14px">Distribució del dolor per zona d'activitat</div>
    <div class="tol-zones">${zonesHtml}</div>
    ${summaryHtml}
  </div>`;
}
